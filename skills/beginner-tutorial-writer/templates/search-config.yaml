# 默认搜索源权重配置
# 数值含义：决定该来源在检索阶段被调用的查询次数比例（合计建议 = 100）
# 不指定时 Agent 加载本文件作为默认；用户也可通过 SKILL 参数 source_weights 覆盖。

default_weights:
  wechat_official_accounts: 30   # 微信公众号（搜狗微信 / mp.weixin.qq.com）
  zhihu: 15                       # 知乎专栏 + 回答
  tech_community: 15              # 腾讯云开发者社区 / CSDN / 掘金 / 博客园
  official: 15                    # 官网 + 官方文档 + 官方公众号
  bilibili: 10                    # B 站视频教程
  xiaohongshu: 5                  # 小红书（小白视角截图）
  github: 5                       # GitHub README / Issues / Discussions
  others: 5                       # 少数派 / 即刻 / OSChina / 微博 / 抖音

# 每个来源对应的查询模板（{q} = product_name 关键词）
query_templates:
  wechat_official_accounts:
    - "site:mp.weixin.qq.com {q} 教程"
    - "site:mp.weixin.qq.com {q} 保姆级"
    - "{q} 公众号"
  zhihu:
    - "site:zhihu.com {q} 教程"
    - "site:zhuanlan.zhihu.com {q}"
    - "{q} 知乎 实战"
  tech_community:
    - "site:cloud.tencent.com {q}"
    - "site:csdn.net {q} 教程"
    - "site:juejin.cn {q}"
    - "site:cnblogs.com {q}"
  official:
    - "{q} 官网"
    - "{q} 官方文档"
    - "{q} docs"
  bilibili:
    - "site:bilibili.com {q} 教程"
    - "{q} B站 入门"
  xiaohongshu:
    - "site:xiaohongshu.com {q}"
    - "{q} 小红书 笔记"
  github:
    - "site:github.com {q}"
    - "{q} awesome"
  others:
    - "site:sspai.com {q}"
    - "site:oschina.net {q}"
    - "{q} 评测"

# 时效性过滤：优先采用过去 N 个月的内容
freshness:
  prefer_within_months: 6
  hard_max_months: 24

# 信息核验阈值
verification:
  min_independent_sources_per_fact: 2
  min_total_cited_articles: 6
  stop_if_product_unknown: true   # 在权威来源都找不到产品时立即停止并反馈
